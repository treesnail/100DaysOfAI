[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-research-agent"
version = "0.1.0"
description = "智研 AI 助手 - 100天AI学习主线项目"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Learner", email = "learner@example.com" },
]
keywords = ["ai", "agent", "langchain", "mcp", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "black>=24.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
smart-research-agent = "smart_research_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["smart_research_agent*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
target-version = ["py310"]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# day017 起引入 async 测试（MCP 内存会话），auto 模式免加 @pytest.mark.asyncio
asyncio_mode = "auto"
addopts = "-v --cov=smart_research_agent --cov-report=term-missing --cov-report=html --cov-branch"

[tool.coverage.run]
branch = true
source = ["smart_research_agent"]

[tool.coverage.report]
# 允许的整体覆盖率下限：低于此值测试命令退出码非零
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
